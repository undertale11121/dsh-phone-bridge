# dsh-phone-bridge: workbench tools for headless agents (selftest-3).
- insert:
    - id: dsh-phone-thread
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: phone-thread
        transport: stdio
        command: !!js process.execPath
        args:
          - "C:\\Users\\17735\\.dsh\\phone-bridge\\src\\thread-mcp.mjs"
          - "--agent"
          - "selftest-3"
          - "--name"
          - "selftest-3"
          - "--mode"
          - "direct"
          - "--setup"
          - "http://127.0.0.1:8789"
        toolCallTimeoutMs: 660000
        failOnStartupError: false
