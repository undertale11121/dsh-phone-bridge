# 互联（phone-bridge）的桌面半。
#
# 这个 bundle 自己就是一个宿主插件：web/index.js 注册 /phone-bridge/config 与
# /phone-bridge/qr.svg 两条路由、左栏的「互联」面板，以及「插件」详情页上的卡片。
#
# 引擎半（bridge.mjs 以 stdio 挂给 @deepseek-ai/dsh-mcp-client）不能写在这里：
# 它的 args 必须是目标机器上的绝对路径，只有装完之后才知道。web/index.js 首次
# 加载时会把那一行补进 profile 的 cordis.patch.yml（幂等，写前备份），补完重启
# 一次 DSH 生效。不想被自动改就设 PHONE_BRIDGE_NO_AUTOPATCH=1，然后手工跑
# bridge.mjs print-patch。
- insert:
    - id: dsh-phone-bridge
      name: dsh-phone-bridge
      config: {}